name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/test.mjs
      - run: npx tsc --noEmit --incremental false
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r benchmarks/requirements.txt
      - run: node --import ./tests/register.mjs --experimental-transform-types benchmarks/scripts/run_studio.mjs
      - run: python benchmarks/scripts/run_primer3.py
      - run: python benchmarks/scripts/summarize.py
      - run: python benchmarks/scripts/check_primer_blast_parser.py
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/results/
  release:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish research preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          if ! gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "v$VERSION" --target "$GITHUB_SHA" --prerelease --title "Primer Studio $VERSION · Research preview" --notes-file "docs/releases/v$VERSION.md"
          fi
