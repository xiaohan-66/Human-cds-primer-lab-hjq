<text x="38" y="42" fill="#5a7889" font-size="12" letter-spacing="2">PRIMER STUDIO / DESIGN WORKFLOW</text>
<g stroke="#ccdce6" fill="#fff"><rect x="38" y="72" width="336" height="130" rx="14"/><rect x="432" y="72" width="336" height="130" rx="14"/><rect x="826" y="72" width="336" height="130" rx="14"/></g>
<g fill="#e9f6f2" stroke="#a6d9cf"><rect x="38" y="276" width="336" height="140" rx="14"/><rect x="432" y="276" width="336" height="140" rx="14"/></g>
